<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peer Risk Detail</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="peer-risk-detail">
    <header class="topbar">
      <div>
        <p class="eyebrow">Daily-updated Google Sheet source</p>
        <h1 id="dashboardTitle">Peer Risk Detail</h1>
      </div>
      <div class="actions">
        <button id="allShopsBtn" type="button">All Shops</button>
        <button id="refreshBtn" type="button" title="Refresh sheet data">Refresh</button>
        <label class="fileBtn" title="Use when browser access to the sheet is blocked">
          Manual CSV
          <input id="csvInput" type="file" accept=".csv,text/csv" />
        </label>
      </div>
    </header>

    <main>
      <section class="statusBand" id="statusBand">
        <span id="sourceStatus">Loading latest sheet data...</span>
        <span id="lastUpdated"></span>
      </section>

      <section class="controls" aria-label="Detail controls">
        <label>
          Anchor date
          <input id="anchorDate" type="date" />
        </label>
        <label>
          Recent trend weeks
          <input id="recentWeeks" type="number" min="2" max="12" value="4" />
        </label>
        <label>
          Baseline weeks
          <input id="baselineWeeks" type="number" min="4" max="24" value="8" />
        </label>
        <label>
          Weak-week threshold
          <input id="weakThreshold" type="number" min="-3" max="0" step="0.1" value="-0.25" />
        </label>
      </section>

      <section class="panel">
        <div class="sectionHeader">
          <h2 id="peerRiskTitle">Peer Risk</h2>
          <p id="currentMonthNote">Current month and rolling 6-month peer risk.</p>
        </div>
        <div id="peerRiskTables"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
